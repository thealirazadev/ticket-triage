[project]
name = "ticket-triage"
version = "0.1.0"
description = "HTTP service that triages inbound support tickets with an LLM provider API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
prod = ["psycopg[binary]==3.3.8"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "black==26.10.1",
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI relies on callables in argument defaults for dependency injection.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
addopts = "--cov=app --cov-report=term-missing:skip-covered"

[tool.coverage.report]
fail_under = 90
